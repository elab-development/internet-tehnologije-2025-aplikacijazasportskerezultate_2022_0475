version: "3.9"

services:

  db:
    image: postgres:15
    container_name: iteh-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: iteh_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: iteh-app
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:1234@db:5432/iteh_db
      JWT_SECRET: nekiSuperTajniString123
    command: sh -c "npx prisma migrate deploy && npm start"

volumes:
  postgres_data: